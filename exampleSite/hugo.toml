baseURL = "https://example.com/"
languageCode = "en-us"
title = "Vasanta Mandapam"
theme = ["github.com/ananthb/mandapam-theme"]

enableGitInfo = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  logo = "logos/logo.png"
  services_heading = "What We Offer"
  google_analytics_id = ""
  gtm_id = ""
  github_repository = "ananthb/mandapam-theme"
  [params.homepage_meta_tags]
    meta_description = "Vasanta Mandapam — a grand wedding and event venue in the heart of the city, with elegant halls, rooftop dining, and full-service event management."
    meta_og_title = "Vasanta Mandapam"
    meta_og_type = "website"
    meta_og_url = "https://example.com"
    meta_og_image = "https://example.com/images/venue.jpg"
    meta_og_description = "Vasanta Mandapam — a grand wedding and event venue in the heart of the city."
    meta_twitter_card = "summary_large_image"
    meta_twitter_site = "@vasantamandapam"
    meta_twitter_creator = "@vasantamandapam"

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menus.main]]
    name = "Venue"
    url = "/venue/"
    weight = 20
  [[menus.main]]
    name = "Facilities"
    url = "/facilities/"
    weight = 30
  [[menus.main]]
    name = "Gallery"
    url = "/gallery/"
    weight = 40
  [[menus.main]]
    name = "Contact Us"
    url = "/#contact"
    weight = 50

[module]
  [[module.imports]]
    path = "github.com/ananthb/mandapam-theme"
