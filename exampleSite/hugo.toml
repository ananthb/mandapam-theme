baseURL = "https://example.com/"
languageCode = "en-in"
title = "Vasanta Mandapam"
theme = ["github.com/calculon-tech/mandapam-theme"]

enableGitInfo = true
disableKinds = ["taxonomy", "term"]
buildFuture = true   # programmes are dated in the future

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  logo = "logos/logo.png"
  hero_eyebrow = "வசந்தா மண்டபம் · மயிலாப்பூர்"
  hero_button = "See the venue"
  hero_button_link = "/venue/"
  whatsapp_message = "Hi, I'd like to check availability at Vasanta Mandapam for "
  services_heading = "What we offer"
  moments_heading = "Recent events"
  google_analytics_id = ""
  gtm_id = ""

  [[params.facts]]
    value = "500"
    label = "seated · 700 standing"
  [[params.facts]]
    value = "300"
    label = "dining hall seats"
  [[params.facts]]
    value = "2005"
    label = "on Temple Road since"
  [[params.facts]]
    value = "1,000+"
    label = "weddings hosted"

  [params.homepage_meta_tags]
    meta_description = "Vasanta Mandapam — a grand wedding and event venue in the heart of the city, with elegant halls, rooftop dining, and full-service event management."
    meta_og_title = "Vasanta Mandapam"
    meta_og_type = "website"
    meta_og_url = "https://example.com"
    meta_og_description = "Vasanta Mandapam — a grand wedding and event venue in the heart of the city."
    meta_twitter_card = "summary_large_image"
    meta_twitter_site = "@vasantamandapam"
    meta_twitter_creator = "@vasantamandapam"

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menus.main]]
    name = "Venue"
    url = "/venue/"
    weight = 20
  [[menus.main]]
    name = "Facilities"
    url = "/facilities/"
    weight = 30
  [[menus.main]]
    name = "Moments"
    url = "/moments/"
    weight = 40
  [[menus.main]]
    name = "Contact"
    url = "/#contact"
    weight = 50

[permalinks]
  moments = "/moments/:year/:slug/"

[module]
  [[module.imports]]
    path = "github.com/calculon-tech/mandapam-theme"
