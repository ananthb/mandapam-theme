{{ define "title" }}Page not found · {{ .Site.Title }}{{ end }}
{{ define "main" }}
<div class="container notfound">
  <span class="kicker">404</span>
  <h1>That page has moved on</h1>
  <p>The link you followed does not lead anywhere on {{ .Site.Title }}.</p>
  <div class="btns">
    <a class="btn btn--primary" href="{{ "/" | relURL }}">Home</a>
    <a class="btn btn--ghost" href="{{ "/#contact" | relURL }}">Contact us</a>
  </div>
</div>
{{ end }}
